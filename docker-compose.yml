services:
  builder-api:
    build:
      context: ./builder/build-service
    environment:
      BUILDER_ADMIN_TOKEN: ${BUILDER_ADMIN_TOKEN:?BUILDER_ADMIN_TOKEN must be set}
      BUILDER_DATA_DIR: /data
      BUILDER_RUNNER_URL: ${BUILDER_RUNNER_URL:-http://runner:8090}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      PROPOSAL_MAX_OUTPUT_TOKENS: ${PROPOSAL_MAX_OUTPUT_TOKENS:-2048}
    expose:
      - "8080"
    volumes:
      - builder-data:/data
    depends_on:
      runner:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  runner:
    build:
      context: ./builder/runner
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  odoo-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      ODOO_BASE_URL: ${ODOO_BASE_URL:?ODOO_BASE_URL must be set}
      ODOO_API_KEY: ${ODOO_API_KEY:?ODOO_API_KEY must be set}
      ODOO_ALLOWED_HOSTS: ${ODOO_ALLOWED_HOSTS:?ODOO_ALLOWED_HOSTS must list the Odoo test host}
      ODOO_DATABASE: ${ODOO_DATABASE:-}
      GATEWAY_PROJECTS_FILE: /config/projects.json
      GATEWAY_PORT: "8070"
    expose:
      - "8070"
    volumes:
      - ${GATEWAY_PROJECTS_FILE:-./gateway/projects.json}:/config/projects.json:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  builder-data:
